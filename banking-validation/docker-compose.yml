services:
  banking-validation:
    image: joao0212/banking-validation:v2
    container_name: banking-validation-container
    environment:
      - QUARKUS_DATASOURCE_USERNAME=user
      - QUARKUS_DATASOURCE_PASSWORD=12345
      - QUARKUS_DATASOURCE_HOST=postgres-banking-validation
      - QUARKUS_DATASOURCE_PORT=5432
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres-banking-validation:5432/agencia_validation
    ports:
      - 8181:8181
    depends_on:
      - postgres-banking-validation

  postgres-banking-validation:
    image: postgres:18-alpine
    container_name: postgres-banking-validation-container
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: agencia_validation
    ports:
      - "5434:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql

  zookeeper-banking:
    image: confluentinc/cp-zookeeper:7.9.8
    container_name: zookeeper-banking
    restart: always
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka-banking:
    image: confluentinc/cp-kafka:7.9.8
    container_name: kafka-banking
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-banking:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper-banking

volumes:
  postgres-data:
    driver: local
